name: Build registry
on:
  push:
    branches: [main]
    paths: ["sentinels/**", "build_registry.py", "sentinel_sdk.py"]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 build_registry.py
      - name: commit if changed
        run: |
          git config user.name sentinel-hub-bot
          git config user.email sentinel-hub-bot@users.noreply.github.com
          git add registry.json
          git diff --cached --quiet || (git commit -m "registry: rebuild" && git push)
